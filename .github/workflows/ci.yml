name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 det_router_bench.py --selftest
      - run: python3 embed_qdrant_bench.py --selftest
      - run: python3 retrieval_eval.py --selftest
      - run: python3 -m unittest discover -s tests -v
      - run: pip install aiohttp && python3 bench_v2/run_bench.py --selftest
